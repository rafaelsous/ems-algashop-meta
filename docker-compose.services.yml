include:
  - docker-compose.tools.yml

services:
  algashop-ordering:
    image: rafaelsousa86/ordering:dev
    restart: no
    ports:
      - 8080:8080
    depends_on:
      algashop-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_TOMCAT_THREADS_MAX: 10 # Default value is 200
      SPRING_THREADS_VIRTUAL_ENABLED: true # Default value is false

  algashop-billing:
    image: rafaelsousa86/billing:dev
    restart: no
    ports:
      - 8082:8082
    depends_on:
      algashop-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker

  algashop-product-catalog:
    image: rafaelsousa86/product-catalog:dev
    restart: no
    ports:
      - 8083:8083
    depends_on:
      algashop-mongodb-1:
        condition: service_healthy
      algashop-mongodb-2:
        condition: service_healthy
      algashop-mongodb-3:
        condition: service_healthy
      algashop-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker

  algashop-authorization-server:
    image: rafaelsousa86/authorization-server:dev
    restart: no
    hostname: auth.algashop.local
    ports:
      - 8081:8081
    depends_on:
      algashop-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker

  algashop-service-registry:
    image: rafaelsousa86/service-registry:dev
    restart: no
    hostname: auth.algashop.local
    ports:
      - 8761:8761
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker